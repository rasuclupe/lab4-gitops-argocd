# Application de ArgoCD: define el estado deseado (repo + ruta) y la política
# de sincronización. ArgoCD (dentro del clúster) observa el repo y reconcilia.
# El CI NUNCA toca el clúster: solo hace commit al overlay. Eso es GitOps pull-based.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rasuclupe/lab4-gitops-argocd.git
    targetRevision: main
    path: overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true       # borra lo que ya no está en Git
      selfHeal: true    # revierte cambios manuales (drift) en el clúster
    syncOptions:
      - CreateNamespace=true
